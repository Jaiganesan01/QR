  <!-- Top Right Finder Target -->
  <rect x="27" y="14" width="6" height="6" rx="1.5" stroke="#22D3EE" stroke-width="1.8" fill="none"/>
  <rect x="29" y="16" width="2" height="2" fill="#22D3EE"/>

  <!-- Bottom Left Finder Target -->
  <rect x="15" y="26" width="6" height="6" rx="1.5" stroke="#22D3EE" stroke-width="1.8" fill="none"/>
  <rect x="17" y="28" width="2" height="2" fill="#22D3EE"/>

  <!-- Data Bit Nodes -->
  <rect x="23" y="22" width="2.5" height="2.5" rx="0.5" fill="#14B8A6"/>
  <rect x="27" y="24" width="2.5" height="2.5" rx="0.5" fill="#14B8A6"/>
