  <rect x="29" y="29" width="3.5" height="3.5" rx="0.5" fill="#14B8A6"/>

  <!-- Protective Crosshair / Laser Reticle -->
  <path d="M11 23H13M35 23H37" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round"/>
