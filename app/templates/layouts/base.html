<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QShield — QR Phishing Detection & Awareness System. Decode the QR. Detect the Threat.">
  <title>{% block title %}QShield — QR Phishing Detection & Security Awareness{% endblock %}</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo-shield.svg') }}">

  <!-- Typography: Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Core CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <!-- Header / Navigation -->
  {% include 'components/navbar.html' %}

  <!-- Main Content Block -->
  <main id="mainContent">
    {% block content %}{% endblock %}
  </main>

  <!-- Global Footer -->
  {% include 'components/footer.html' %}

  <!-- Core Scripts -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
